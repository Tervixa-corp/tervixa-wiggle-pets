name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            os_dir: windows
          - os: ubuntu-latest
            os_dir: linux
          - os: macos-latest
            os_dir: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build UI bundle (embedded by the desktop shell)
        run: npm install && npm run build
        working-directory: apps/desktop-ui
      - name: Build release binaries
        run: cargo build --release --workspace
      - name: Package
        run: bash scripts/package-releases.sh .
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tervixa-wiggle-${{ matrix.os_dir }}
          path: releases/${{ matrix.os_dir }}/

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: releases/
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            releases/**/*.exe
            releases/**/*.msi
            releases/**/*.deb
            releases/**/*.rpm
            releases/**/*.AppImage
            releases/**/*.dmg
            releases/**/wiggle
