[package]
name = "tervixa-wiggle-pets-core"
version = "1.0.0"
edition = "2021"
description = "TERVIXA WIGGLE PETS — deterministic desktop pet engine (timed skills, AI agent watcher, permission bridge, pet registry, AI chat router)"
license = "MIT"
repository = "https://github.com/tervixa/tervixa-wiggle-pets"
authors = ["Tervixa Corporation <forge@tervixa.in>"]

[lib]
name = "wiggle_core"
path = "src/lib.rs"

[[bin]]
name = "wiggle-server"
path = "src/bin/server.rs"

[[bin]]
name = "wiggle-hook"
path = "src/bin/hook.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
ureq = { version = "2", default-features = false, features = ["json", "tls", "gzip"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[profile.release]
opt-level = "s"
lto = true
strip = true

# Standalone workspace — detached from any parent Cargo workspace.
[workspace]
