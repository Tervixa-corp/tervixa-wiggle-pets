<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'" />
  <style>
    :root { --canvas:#0a0a0a; --card:#121212; --border:#242424; --text:#ededed; --dim:#8a8a8a;
      --mono:"JetBrains Mono","Cascadia Mono",Consolas,monospace; --sans:Inter,"Segoe UI",system-ui,sans-serif; }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background:var(--canvas); color:var(--text); font-family:var(--sans); height:100vh; display:flex; flex-direction:column; }
    header { padding:10px 14px; border-bottom:1px solid var(--border); font-family:var(--mono); font-size:11px; color:var(--dim);
      display:flex; justify-content:space-between; letter-spacing:.08em; }
    header button { background:none; border:none; color:var(--dim); cursor:pointer; font-family:var(--mono); font-size:11px; }
    #log { flex:1; overflow-y:auto; padding:12px 14px; font-size:12.5px; line-height:1.6; }
    #log .q { color:var(--text); margin:8px 0 2px; }
    #log .a { color:var(--dim); margin:0 0 10px; white-space:pre-wrap; }
    #log .sys { color:var(--dim); font-family:var(--mono); font-size:11px; }
    footer { border-top:1px solid var(--border); display:flex; }
    #msg { flex:1; background:var(--card); border:none; color:var(--text); padding:12px 14px; font-family:var(--mono); font-size:12px; outline:none; }
    #send { background:var(--text); color:var(--canvas); border:none; padding:0 18px; font-family:var(--mono); cursor:pointer; }
    .hint { padding:6px 14px; color:var(--dim); font-size:10.5px; font-family:var(--mono); border-top:1px solid var(--border); }
  </style>
</head>
<body>
  <header>
    <span>TERVIXA WIGGLE · CHAT &amp; QUICK COMMAND</span>
    <button id="close">✕</button>
  </header>
  <div id="log"><div class="sys">Type a reminder ("remind me every day at 7pm to …"), a note ("keep in mind: …"), or just chat with your pet.</div></div>
  <footer>
    <input id="msg" placeholder="remind me in 20 minutes to check the build" autofocus />
    <button id="send">↵</button>
  </footer>
  <div class="hint">Alt+Space · reminders &amp; notes are parsed with zero AI · open questions use your local model</div>
  <script>
    const tervixa = window.tervixa;
    const log = document.getElementById("log");
    const msg = document.getElementById("msg");

    function add(cls, text) {
      const d = document.createElement("div");
      d.className = cls;
      d.textContent = text;
      log.appendChild(d);
      log.scrollTop = log.scrollHeight;
    }

    async function send() {
      const text = msg.value.trim();
      if (!text) return;
      msg.value = "";
      add("q", text);

      // Deterministic quick-command first (reminders / notes / interrupt).
      const qc = await tervixa.post("/api/quick-command", { text });
      if (qc && qc.ok && !/Could not parse/.test(qc.data.reply)) {
        add("sys", qc.data.reply);
        return;
      }
      // Otherwise chat (AI router; errors surface honestly).
      add("sys", "thinking…");
      const r = await tervixa.post("/api/chat", { message: text });
      log.querySelector(".sys:last-child")?.remove();
      if (r && r.ok) add("a", r.data.reply);
      else add("sys", (r && r.error) || "AI chat unavailable (configure a model in Control Center → AI)");
    }

    document.getElementById("send").onclick = send;
    msg.addEventListener("keydown", (e) => e.key === "Enter" && send());
    document.getElementById("close").onclick = () => window.close();
  </script>
</body>
</html>
